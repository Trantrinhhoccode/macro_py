name: Daily Market Digest

on:
  schedule:
    - cron: '0 23 * * *'  # 06:00 sáng giờ Việt Nam (UTC+7 → UTC 23:00)
    - cron: '0 3 * * *'   # 10:00 sáng giờ Việt Nam (UTC+7 → UTC 03:00)
    - cron: '0 9 * * *'   # 16:00 chiều giờ Việt Nam (UTC+7 → UTC 09:00)
  workflow_dispatch:        # cho phép chạy thủ công từ GitHub UI

permissions:
  contents: write   # cần để commit lại sent_urls.json sau mỗi lần chạy

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest
        env:
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL:        gemini-3.1-flash-lite-preview
          MIN_SCORE:           "7"
          EMAIL_SENDER:        ${{ secrets.EMAIL_SENDER }}
          EMAIL_APP_PASSWORD:  ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENT:     ${{ secrets.EMAIL_RECIPIENT }}
        run: python digest.py

      - name: Commit sent_urls.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add sent_urls.json || true
          git diff --staged --quiet || git commit -m "chore: update sent_urls [skip ci]"
          git push || true
